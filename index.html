<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Order Delicious Food</title>
    <!-- Google Fonts, Tailwind CSS & Supabase JS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-500 flex items-center gap-2 cursor-pointer" onclick="backToVendors()">
                <i data-lucide="utensils"></i> FoodHub
            </h1>
            <div class="flex items-center gap-3">
                <!-- User Account / Login Button -->
                <div id="user-header-profile" class="flex items-center gap-2">
                    <button id="auth-btn" onclick="openAuthModal()" class="bg-orange-50 hover:bg-orange-100 text-orange-600 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                        <i data-lucide="user" class="w-4 h-4"></i> <span id="auth-btn-text">Login / Register</span>
                    </button>
                    <button id="logout-btn" onclick="logoutCustomer()" class="hidden bg-gray-100 hover:bg-red-50 text-gray-600 hover:text-red-600 p-2 rounded-xl transition">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>

                <button onclick="toggleCart()" class="relative bg-orange-50 hover:bg-orange-100 text-orange-600 px-4 py-2 rounded-xl transition flex items-center gap-2 font-medium text-xs sm:text-sm">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Cart</span>
                    <span id="cartCount" class="bg-orange-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Customer Auth Modal -->
    <div id="authModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5 animate-fade-in">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="user-check" class="text-orange-500"></i> Customer Portal
                </h3>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x"></i></button>
            </div>

            <!-- Auth Tabs -->
            <div class="flex bg-gray-100 p-1 rounded-xl">
                <button id="tab-cust-login" onclick="switchCustTab('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-orange-600 bg-white shadow-xs">
                    Login
                </button>
                <button id="tab-cust-reg" onclick="switchCustTab('register')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-500">
                    Register
                </button>
            </div>

            <!-- Login Form -->
            <form id="cust-login-form" onsubmit="handleCustLogin(event)" class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-600">Mobile Number</label>
                    <input type="text" id="cust-login-phone" required placeholder="01700000000" class="w-full mt-1 px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Password</label>
                    <input type="password" id="cust-login-pass" required placeholder="••••••••" class="w-full mt-1 px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                </div>
                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-xl transition text-sm">
                    Login to FoodHub
                </button>
            </form>

            <!-- Register Form -->
            <form id="cust-reg-form" onsubmit="handleCustRegister(event)" class="hidden space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-600">Full Name</label>
                    <input type="text" id="cust-reg-name" required placeholder="Anika Rahman" class="w-full mt-1 px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Mobile Number</label>
                    <input type="text" id="cust-reg-phone" required placeholder="01700000000" class="w-full mt-1 px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Password</label>
                    <input type="password" id="cust-reg-pass" required placeholder="••••••••" class="w-full mt-1 px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Delivery Address</label>
                    <input type="text" id="cust-reg-address" required placeholder="House 12, Road 5, Banani, Dhaka" class="w-full mt-1 px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                </div>
                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-xl transition text-sm">
                    Create Customer Account
                </button>
            </form>
        </div>
    </div>

    <!-- Main Views Container -->
    <main class="flex-grow">
        <!-- Hero Section -->
        <section class="hero-bg text-white py-16 px-4 text-center">
            <div class="max-w-3xl mx-auto">
                <h2 class="text-3xl sm:text-4xl font-bold mb-3">Delicious Food, Delivered Fast</h2>
                <p class="text-gray-200 mb-6 text-sm sm:text-base">Discover top-rated vendors and menu items near you.</p>
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <div class="relative flex-grow max-w-md">
                        <i data-lucide="search" class="absolute left-4 top-3.5 text-gray-400 w-5 h-5"></i>
                        <input type="text" id="searchInput" oninput="filterData()" placeholder="Search vendors or items..." class="w-full pl-12 pr-4 py-3 rounded-xl text-gray-800 bg-white focus:outline-none shadow-md text-sm">
                    </div>
                    <select id="categoryFilter" onchange="filterData()" class="px-4 py-3 rounded-xl text-gray-800 bg-white focus:outline-none shadow-md font-medium text-sm">
                        <option value="all">All Categories</option>
                        <option value="Fast Food">Fast Food</option>
                        <option value="Italian">Italian</option>
                        <option value="Desi">Desi / Local</option>
                        <option value="Dessert">Dessert</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Vendors Grid -->
        <section class="max-w-7xl mx-auto px-4 py-10" id="vendorSection">
            <h3 class="text-xl sm:text-2xl font-bold mb-6 flex items-center gap-2">
                <i data-lucide="store" class="text-orange-500"></i> Available Restaurants
            </h3>
            <div id="vendorContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loaded dynamically -->
            </div>
        </section>

        <!-- Menu View (Hidden initially) -->
        <section id="menuSection" class="max-w-7xl mx-auto px-4 py-10 hidden">
            <button onclick="backToVendors()" class="mb-6 flex items-center gap-2 text-orange-500 font-semibold hover:underline text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Restaurants
            </button>
            <div id="vendorHeader" class="bg-white p-6 rounded-2xl shadow-sm border mb-8 flex items-center gap-4"></div>
            <h4 class="text-xl font-bold mb-6">Menu Items</h4>
            <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- Customer Orders Tracking Section -->
        <section class="max-w-7xl mx-auto px-4 py-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="clock" class="text-orange-500"></i> My Live Orders
                </h3>
                <div id="customer-orders-list" class="space-y-3 divide-y divide-gray-100 text-sm">
                    <p class="text-gray-400 py-4 text-center">Login to view your live orders.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Slide-over Cart Drawer -->
    <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl animate-fade-in">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold flex items-center gap-2"><i data-lucide="shopping-cart"></i> Your Cart</h3>
                    <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-700"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                <div id="cartItems" class="space-y-3 overflow-y-auto max-h-[35vh]"></div>

                <!-- Checkout Details -->
                <div class="mt-6 space-y-3 border-t pt-4">
                    <p class="text-xs font-semibold text-gray-600 flex items-center gap-1">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-orange-500"></i> Delivery Contact Details
                    </p>
                    <input type="text" id="custName" placeholder="Your Full Name" class="w-full px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                    <input type="text" id="custMobile" placeholder="Mobile Number" class="w-full px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                    <input type="text" id="custAddress" placeholder="Delivery Address" class="w-full px-3 py-2 rounded-xl border text-sm focus:outline-orange-500">
                </div>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total Amount:</span>
                    <span id="cartTotal" class="text-orange-500">৳0.00</span>
                </div>
                <button onclick="placeOrder()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-orange-500/30 text-sm">
                    Place Order Now
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 FoodHub. All rights reserved.</p>
    </footer>

    <!-- Script Application Logic -->
    <script>
        const SUPABASE_URL = 'https://kdqyompkfmnocpihfzdj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkcXlvbXBrZm1ub2NwaWhmemRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDkxOTIsImV4cCI6MjEwNDg4NTE5Mn0.4gmwMruyf54ZdXAADEAa9noLZD5JMFyLOzrszUIMVns';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let vendors = [];
        let cart = [];
        let currentVendorId = null;
        let currentVendorName = "";
        let currentCustomer = null;

        lucide.createIcons();

        // CUSTOMER AUTH CHECK
        function checkCustomerAuth() {
            const saved = localStorage.getItem('foodhub_active_customer');
            if (saved) {
                try {
                    currentCustomer = JSON.parse(saved);
                    document.getElementById('auth-btn-text').innerText = currentCustomer.name || 'My Profile';
                    document.getElementById('logout-btn').classList.remove('hidden');

                    document.getElementById('custName').value = currentCustomer.name || '';
                    document.getElementById('custMobile').value = currentCustomer.phone || '';
                    document.getElementById('custAddress').value = currentCustomer.address || '';
                } catch(e) {
                    localStorage.removeItem('foodhub_active_customer');
                }
            }
            loadCustomerOrders();
        }

        function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

        function switchCustTab(tab) {
            if (tab === 'login') {
                document.getElementById('cust-login-form').classList.remove('hidden');
                document.getElementById('cust-reg-form').classList.add('hidden');
                document.getElementById('tab-cust-login').className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-orange-600 bg-white shadow-xs';
                document.getElementById('tab-cust-reg').className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-gray-500';
            } else {
                document.getElementById('cust-login-form').classList.add('hidden');
                document.getElementById('cust-reg-form').classList.remove('hidden');
                document.getElementById('tab-cust-reg').className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-orange-600 bg-white shadow-xs';
                document.getElementById('tab-cust-login').className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-gray-500';
            }
        }

        async function handleCustRegister(e) {
            e.preventDefault();
            const name = document.getElementById('cust-reg-name').value.trim();
            const phone = document.getElementById('cust-reg-phone').value.trim();
            const password = document.getElementById('cust-reg-pass').value.trim();
            const address = document.getElementById('cust-reg-address').value.trim();

            const { data, error } = await supabaseClient.from('customers').insert([{
                name, phone, password, address
            }]).select();

            if (error) {
                alert("Registration Notice: " + error.message);
                return;
            }

            if (data && data.length > 0) {
                currentCustomer = data[0];
                localStorage.setItem('foodhub_active_customer', JSON.stringify(currentCustomer));
                alert(`Welcome ${currentCustomer.name}! Account created.`);
                closeAuthModal();
                checkCustomerAuth();
            }
        }

        async function handleCustLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('cust-login-phone').value.trim();
            const password = document.getElementById('cust-login-pass').value.trim();

            const { data } = await supabaseClient.from('customers').select('*').eq('phone', phone);
            if (!data || data.length === 0) {
                alert("Account not found. Please Register!");
                switchCustTab('register');
                return;
            }

            const user = data.find(c => c.password === password);
            if (!user) return alert("Incorrect Password!");

            currentCustomer = user;
            localStorage.setItem('foodhub_active_customer', JSON.stringify(currentCustomer));
            alert(`Logged in as ${currentCustomer.name}`);
            closeAuthModal();
            checkCustomerAuth();
        }

        function logoutCustomer() {
            localStorage.removeItem('foodhub_active_customer');
            currentCustomer = null;
            document.getElementById('auth-btn-text').innerText = 'Login / Register';
            document.getElementById('logout-btn').classList.add('hidden');
            loadCustomerOrders();
        }

        // Fetch Data from Supabase
        async function fetchAppData() {
            try {
                const { data: vendorData } = await supabaseClient.from('vendors').select('*');
                const { data: menuData } = await supabaseClient.from('menus').select('*');

                vendors = (vendorData || []).map(res => ({
                    id: res.id,
                    name: res.name,
                    category: res.types || 'Fast Food',
                    image: res.profile_image_url || 'https://images.unsplash.com/photo-1552566626-52f8b828add9',
                    address: res.address || 'Dhaka',
                    lat: res.latitude || 23.7910,
                    long: res.longitude || 90.4060,
                    menu: (menuData || []).filter(m => m.vendor_id == res.id)
                }));

                renderVendors(vendors);
            } catch (err) {
                console.error("Error loading app data:", err);
            }
        }

        function renderVendors(data) {
            const container = document.getElementById('vendorContainer');
            container.innerHTML = '';
            if(data.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No restaurants found right now.</p>`;
                return;
            }
            data.forEach(res => {
                container.innerHTML += `
                    <div onclick="openVendor(${res.id})" class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition cursor-pointer group border border-gray-100">
                        <div class="h-48 overflow-hidden">
                            <img src="${res.image}" alt="${res.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        </div>
                        <div class="p-5">
                            <span class="text-xs bg-orange-100 text-orange-600 px-3 py-1 rounded-full font-semibold">${res.category}</span>
                            <h4 class="text-lg font-bold mt-2 text-gray-800">${res.name}</h4>
                            <p class="text-xs text-gray-500 mt-1">${res.address}</p>
                            <div class="flex items-center gap-1 text-yellow-500 mt-2 text-sm font-semibold">
                                <i data-lucide="star" class="w-4 h-4 fill-current"></i> 5.0 • ${res.menu.length} items
                            </div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            const filtered = vendors.filter(res => {
                const matchesCategory = category === 'all' || res.category.toLowerCase().includes(category.toLowerCase());
                const matchesSearch = res.name.toLowerCase().includes(query) || res.menu.some(m => m.name.toLowerCase().includes(query));
                return matchesCategory && matchesSearch;
            });
            renderVendors(filtered);
        }

        function openVendor(id) {
            const res = vendors.find(r => r.id === id);
            currentVendorId = res.id;
            currentVendorName = res.name;

            document.getElementById('vendorSection').classList.add('hidden');
            document.querySelector('section.hero-bg').classList.add('hidden');
            
            const menuSection = document.getElementById('menuSection');
            menuSection.classList.remove('hidden');

            document.getElementById('vendorHeader').innerHTML = `
                <img src="${res.image}" class="w-20 h-20 rounded-xl object-cover border">
                <div>
                    <h3 class="text-2xl font-bold">${res.name}</h3>
                    <p class="text-gray-500 text-sm">${res.category} • ${res.address} • ⭐ 5.0</p>
                </div>
            `;

            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = '';
            if(res.menu.length === 0) {
                menuContainer.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">No menu items added for this restaurant yet.</p>`;
                return;
            }

            res.menu.forEach(item => {
                menuContainer.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                        <img src="${item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" class="w-24 h-24 rounded-xl object-cover">
                        <div class="flex-grow">
                            <h5 class="font-bold text-gray-800 text-base">${item.name}</h5>
                            <p class="text-orange-500 font-bold mt-1 text-base">৳${parseFloat(item.price).toFixed(2)}</p>
                            <button onclick="addToCart('${item.name}', ${item.price})" class="mt-2 bg-orange-500 hover:bg-orange-600 text-white text-xs px-4 py-2 rounded-lg transition font-medium shadow-xs">
                                Add to Cart +
                            </button>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function backToVendors() {
            document.getElementById('vendorSection').classList.remove('hidden');
            document.querySelector('section.hero-bg').classList.remove('hidden');
            document.getElementById('menuSection').classList.add('hidden');
        }

        // Cart Actions
        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('hidden');
        }

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if(existing) { existing.qty++; } 
            else { cart.push({ name, price, qty: 1 }); }
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-8">Your cart is empty.</p>`;
            }

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <div>
                            <h6 class="font-semibold text-sm">${item.name}</h6>
                            <p class="text-xs text-gray-500">৳${item.price} x ${item.qty}</p>
                        </div>
                        <button onclick="cart.splice(${index},1); updateCartUI();" class="text-red-500 text-xs font-semibold hover:underline">Remove</button>
                    </div>
                `;
            });
            document.getElementById('cartTotal').innerText = `৳${total.toFixed(2)}`;
        }

        // Place Order
        async function placeOrder() {
            if(cart.length === 0) return alert("Your cart is empty!");
            const name = document.getElementById('custName').value.trim();
            const mobile = document.getElementById('custMobile').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if(!name || !mobile || !address) { alert("Please fill up all contact details!"); return; }

            const total_amount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const { data, error } = await supabaseClient.from('orders').insert([{
                vendor_id: currentVendorId,
                customer_id: currentCustomer ? currentCustomer.id : null,
                customer_name: name,
                customer_phone: mobile,
                vendor_name: currentVendorName,
                items: cart,
                amount: total_amount,
                delivery_address: address,
                status: 'Pending',
                time: new Date().toISOString()
            }]).select();

            if(error) {
                alert("Error placing order: " + error.message);
            } else {
                alert("Order placed successfully! Vendor will review your order.");
                cart = [];
                updateCartUI();
                toggleCart();
                loadCustomerOrders();
            }
        }

        async function loadCustomerOrders() {
            const container = document.getElementById('customer-orders-list');
            container.innerHTML = '';

            let query = supabaseClient.from('orders').select('*').order('id', { ascending: false });
            if (currentCustomer) {
                query = query.eq('customer_phone', currentCustomer.phone);
            }

            const { data: oData } = await query;

            if (!oData || oData.length === 0) {
                container.innerHTML = '<p class="text-gray-400 py-4 text-center">No recent orders found.</p>';
                return;
            }

            oData.forEach(o => {
                let badgeClass = 'bg-amber-100 text-amber-800';
                if (o.status === 'Accepted' || o.status === 'Preparing') badgeClass = 'bg-blue-100 text-blue-800';
                if (o.status === 'Out for Delivery') badgeClass = 'bg-purple-100 text-purple-800';
                if (o.status === 'Delivered') badgeClass = 'bg-emerald-100 text-emerald-800';
                if (o.status === 'Rejected') badgeClass = 'bg-red-100 text-red-800';

                const div = document.createElement('div');
                div.className = 'py-3 flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-bold text-gray-800">Order #${o.id} - ${o.vendor_name || 'Restaurant'}</p>
                        <p class="text-xs text-gray-500">${o.delivery_address || ''}</p>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-orange-600 block">৳${o.amount}</span>
                        <span class="${badgeClass} text-[10px] font-bold px-2 py-0.5 rounded-full inline-block mt-1">${o.status}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        checkCustomerAuth();
        fetchAppData();
    </script>
</body>
</html>
