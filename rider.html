<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Rider Portal</title>
    <!-- Google Fonts, Tailwind CSS, Lucide & Supabase JS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-500 flex items-center gap-2">
                <i data-lucide="bike"></i> FoodHub Rider Portal
            </h1>
            <div class="flex items-center gap-3">
                <select id="rider-select" class="bg-orange-50 border border-orange-200 text-orange-600 font-semibold px-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="">Select Rider Profile</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow space-y-6 w-full">

        <!-- GPS Location & Duty Panel -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="navigation" class="text-orange-500"></i> Rider GPS & Duty Status
                </h2>
                <span id="duty-badge" class="bg-gray-100 text-gray-600 font-semibold text-xs px-3 py-1 rounded-full">Duty: Offline</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-semibold text-gray-600">Live Latitude</label>
                    <input id="rider-lat" type="number" step="0.0001" value="23.7910" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-orange-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Live Longitude</label>
                    <input id="rider-long" type="number" step="0.0001" value="90.4060" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-orange-500">
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button id="toggle-duty-btn" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-md shadow-emerald-500/20">
                    <i data-lucide="power"></i> Toggle Online / Offline
                </button>
                <button id="update-gps-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-md shadow-orange-500/20">
                    <i data-lucide="map-pin"></i> Update GPS Location
                </button>
            </div>
        </div>

        <!-- Available Delivery Requests -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i data-lucide="package" class="text-orange-500"></i> Available Delivery Requests
            </h2>
            <div id="deliveries-list" class="space-y-3">
                <p class="text-gray-400 text-center py-6">Select a rider profile above to view available deliveries.</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 FoodHub Rider Portal. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://kdqyompkfmnocpihfzdj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkcXlvbXBrZm1ub2NwaWhmemRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDkxOTIsImV4cCI6MjEwNDg4NTE5Mn0.4gmwMruyf54ZdXAADEAa9noLZD5JMFyLOzrszUIMVns';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let riders = [];
        let currentRiderId = null;

        lucide.createIcons();

        async function loadRiders() {
            const { data } = await supabaseClient.from('riders').select('*');
            const select = document.getElementById('rider-select');
            select.innerHTML = '<option value="">Select Rider Profile</option>';

            if (data) {
                riders = data;
                data.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.innerText = r.name + ' (' + (r.phone || 'No phone') + ')';
                    select.appendChild(opt);
                });
            }
        }

        document.getElementById('rider-select').addEventListener('change', e => {
            currentRiderId = Number(e.target.value);
            if (currentRiderId) {
                const r = riders.find(x => x.id === currentRiderId);
                if (r) {
                    document.getElementById('duty-badge').innerText = 'Duty: ' + r.status;
                    document.getElementById('rider-lat').value = r.live_lat || 23.7910;
                    document.getElementById('rider-long').value = r.live_long || 90.4060;
                }
                loadOrders();
            }
        });

        async function loadOrders() {
            const { data } = await supabaseClient.from('orders').select('*');
            const container = document.getElementById('deliveries-list');
            container.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(o => {
                    const div = document.createElement('div');
                    div.className = 'p-4 bg-gray-50 border border-gray-200 rounded-xl space-y-2 flex flex-col sm:flex-row justify-between items-start sm:items-center';
                    div.innerHTML = `
                        <div>
                            <p class="font-bold text-gray-800 text-sm">Order #${o.id} - ${o.vendor_name || 'Vendor'}</p>
                            <p class="text-xs text-gray-500">Customer: ${o.customer_name || 'N/A'} • Address: ${o.delivery_address || 'N/A'}</p>
                            <p class="text-orange-600 font-bold text-sm">৳${o.amount}</p>
                        </div>
                        <button onclick="acceptOrder(${o.id})" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-xl text-xs transition shadow-md shadow-orange-500/20">
                            Accept Delivery
                        </button>
                    `;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<p class="text-gray-400 text-center py-6">No active delivery requests.</p>';
            }
        }

        async function acceptOrder(orderId) {
            if (!currentRiderId) return alert('Select rider profile first!');
            await supabaseClient.from('orders').update({ rider_id: currentRiderId, status: 'Preparing' }).eq('id', orderId);
            alert('Order accepted!');
            loadOrders();
        }

        document.getElementById('toggle-duty-btn').onclick = async () => {
            if (!currentRiderId) return alert('Select rider profile first!');
            const r = riders.find(x => x.id === currentRiderId);
            const nextStatus = r && r.status === 'Online' ? 'Offline' : 'Online';
            await supabaseClient.from('riders').update({ status: nextStatus }).eq('id', currentRiderId);
            document.getElementById('duty-badge').innerText = 'Duty: ' + nextStatus;
            loadRiders();
        };

        document.getElementById('update-gps-btn').onclick = async () => {
            if (!currentRiderId) return alert('Select rider profile first!');
            const lat = Number(document.getElementById('rider-lat').value);
            const long = Number(document.getElementById('rider-long').value);
            await supabaseClient.from('riders').update({ live_lat: lat, live_long: long }).eq('id', currentRiderId);
            alert('GPS location updated!');
        };

        loadRiders();
    </script>
</body>
</html>
