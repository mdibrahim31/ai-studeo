<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Vendor Portal</title>
    <!-- Google Fonts, Tailwind CSS, Lucide & Supabase JS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-500 flex items-center gap-2">
                <i data-lucide="store"></i> FoodHub Vendor Portal
            </h1>
            <div class="flex items-center gap-3">
                <select id="vendor-select" class="bg-orange-50 border border-orange-200 text-orange-600 font-semibold px-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="">Select Vendor Profile</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow space-y-6 w-full">

        <!-- Overview Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-orange-100 text-orange-500 rounded-xl flex items-center justify-center font-bold text-xl">
                    <i data-lucide="dollar-sign"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Total Revenue</p>
                    <p id="stat-revenue" class="text-2xl font-bold text-gray-800">৳0</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 text-blue-500 rounded-xl flex items-center justify-center font-bold text-xl">
                    <i data-lucide="shopping-bag"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Kitchen Orders</p>
                    <p id="stat-orders" class="text-2xl font-bold text-gray-800">0</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-500 rounded-xl flex items-center justify-center font-bold text-xl">
                    <i data-lucide="utensils-crossed"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Active Menu Dishes</p>
                    <p id="stat-dishes" class="text-2xl font-bold text-gray-800">0</p>
                </div>
            </div>
        </div>

        <!-- Kitchen Orders Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i data-lucide="clock" class="text-orange-500"></i> Incoming Kitchen Orders
            </h2>
            <div id="vendor-orders-list" class="space-y-3">
                <p class="text-gray-400 text-center py-6">Select a vendor profile above to view orders.</p>
            </div>
        </div>

        <!-- Menu Catalog Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="book-open" class="text-orange-500"></i> Restaurant Menu Catalog
                </h2>
                <button id="open-add-dish-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-xl text-sm transition flex items-center gap-2 shadow-md shadow-orange-500/20">
                    <i data-lucide="plus"></i> Add New Dish
                </button>
            </div>
            <div id="vendor-dishes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-gray-400 col-span-full text-center py-6">Select vendor profile to load menu dishes.</p>
            </div>
        </div>

    </main>

    <!-- Add Dish Modal -->
    <div id="dish-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-800 text-lg">Add New Menu Dish</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600"><i data-lucide="x"></i></button>
            </div>
            <div>
                <label class="font-semibold text-xs text-gray-600">Dish Name</label>
                <input id="dish-name" type="text" placeholder="e.g. Special Beef Burger" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-orange-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="font-semibold text-xs text-gray-600">Price (৳)</label>
                    <input id="dish-price" type="number" value="180" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-orange-500">
                </div>
                <div>
                    <label class="font-semibold text-xs text-gray-600">Category</label>
                    <input id="dish-cat" type="text" value="Fast Food" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-orange-500">
                </div>
            </div>
            <div>
                <label class="font-semibold text-xs text-gray-600">Image URL</label>
                <input id="dish-img" type="text" placeholder="https://images.unsplash.com/..." class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-orange-500">
            </div>
            <div>
                <label class="font-semibold text-xs text-gray-600">Description</label>
                <textarea id="dish-desc" rows="2" placeholder="Delicious ingredients..." class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-orange-500"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button id="close-modal-btn-2" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl text-sm">Cancel</button>
                <button id="save-dish-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-xl text-sm transition">Save Dish</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 FoodHub Vendor Portal. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://kdqyompkfmnocpihfzdj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkcXlvbXBrZm1ub2NwaWhmemRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDkxOTIsImV4cCI6MjEwNDg4NTE5Mn0.4gmwMruyf54ZdXAADEAa9noLZD5JMFyLOzrszUIMVns';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let vendors = [];
        let currentVendorId = null;

        lucide.createIcons();

        async function loadVendors() {
            const { data } = await supabaseClient.from('vendors').select('*');
            const select = document.getElementById('vendor-select');
            select.innerHTML = '<option value="">Select Vendor Profile</option>';

            if (data) {
                vendors = data;
                data.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.id;
                    opt.innerText = v.name;
                    select.appendChild(opt);
                });
            }
        }

        document.getElementById('vendor-select').addEventListener('change', e => {
            currentVendorId = Number(e.target.value);
            if (currentVendorId) loadVendorData();
        });

        async function loadVendorData() {
            if (!currentVendorId) return;

            const { data: oData } = await supabaseClient.from('orders').select('*').eq('vendor_id', currentVendorId);
            const ordersContainer = document.getElementById('vendor-orders-list');
            ordersContainer.innerHTML = '';

            if (oData && oData.length > 0) {
                document.getElementById('stat-orders').innerText = oData.length;
                const totalRevenue = oData.reduce((sum, o) => sum + (o.amount || 0), 0);
                document.getElementById('stat-revenue').innerText = '৳' + totalRevenue;

                oData.forEach(o => {
                    const div = document.createElement('div');
                    div.className = 'p-4 bg-gray-50 border border-gray-200 rounded-xl space-y-2 flex flex-col sm:flex-row justify-between items-start sm:items-center';
                    div.innerHTML = `
                        <div>
                            <p class="font-bold text-gray-800 text-sm">Order #${o.id} - ${o.customer_name || 'Customer'}</p>
                            <p class="text-xs text-gray-500">${o.delivery_address || 'No address specified'}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-orange-600 text-base">৳${o.amount}</span>
                            <select onchange="updateOrderStatus(${o.id}, this.value)" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-semibold focus:outline-orange-500">
                                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Preparing" ${o.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
                                <option value="Ready for Pickup" ${o.status === 'Ready for Pickup' ? 'selected' : ''}>Ready for Pickup</option>
                                <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                            </select>
                        </div>
                    `;
                    ordersContainer.appendChild(div);
                });
            } else {
                ordersContainer.innerHTML = '<p class="text-gray-400 text-center py-6">No orders received yet.</p>';
            }

            const { data: mData } = await supabaseClient.from('menus').select('*').eq('vendor_id', currentVendorId);
            const dishesGrid = document.getElementById('vendor-dishes-grid');
            dishesGrid.innerHTML = '';

            if (mData) {
                document.getElementById('stat-dishes').innerText = mData.length;
                mData.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'p-4 bg-white border border-gray-100 shadow-sm rounded-2xl space-y-2 flex gap-3 items-center';
                    card.innerHTML = `
                        <img src="${m.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" class="w-16 h-16 rounded-xl object-cover">
                        <div class="flex-grow">
                            <div class="flex justify-between font-bold text-sm">
                                <span>${m.name}</span>
                                <span class="text-orange-500">৳${m.price}</span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">${m.description || ''}</p>
                        </div>
                    `;
                    dishesGrid.appendChild(card);
                });
            }
        }

        async function updateOrderStatus(orderId, status) {
            await supabaseClient.from('orders').update({ status }).eq('id', orderId);
            loadVendorData();
        }

        const closeModal = () => document.getElementById('dish-modal').classList.add('hidden');
        document.getElementById('open-add-dish-btn').onclick = () => document.getElementById('dish-modal').classList.remove('hidden');
        document.getElementById('close-modal-btn').onclick = closeModal;
        document.getElementById('close-modal-btn-2').onclick = closeModal;

        document.getElementById('save-dish-btn').onclick = async () => {
            const name = document.getElementById('dish-name').value;
            const price = Number(document.getElementById('dish-price').value);
            const category = document.getElementById('dish-cat').value;
            const image_url = document.getElementById('dish-img').value;
            const description = document.getElementById('dish-desc').value;

            if (!name || !price || !currentVendorId) return alert('Fill name, price and select vendor profile!');

            await supabaseClient.from('menus').insert([{
                vendor_id: currentVendorId,
                name,
                price,
                category,
                image_url,
                description,
                available: true,
                status: 'Active'
            }]);

            closeModal();
            loadVendorData();
        };

        loadVendors();
    </script>
</body>
</html>
