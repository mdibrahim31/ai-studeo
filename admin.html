<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Admin Dashboard</title>
    <!-- Google Fonts, Tailwind CSS, Lucide & Supabase JS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-500 flex items-center gap-2">
                <i data-lucide="shield-check"></i> FoodHub Admin Dashboard
            </h1>
            <span class="bg-orange-100 text-orange-600 text-xs font-bold px-3 py-1 rounded-full">System Control</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow space-y-6 w-full">

        <!-- Overview Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-orange-100 text-orange-500 rounded-xl flex items-center justify-center font-bold text-xl">
                    <i data-lucide="store"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">Total Vendors</p>
                    <p id="stat-vendors" class="text-2xl font-bold text-gray-800">0</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-500 rounded-xl flex items-center justify-center font-bold text-xl">
                    <i data-lucide="bike"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">Active Riders</p>
                    <p id="stat-riders" class="text-2xl font-bold text-gray-800">0</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 text-blue-500 rounded-xl flex items-center justify-center font-bold text-xl">
                    <i data-lucide="shopping-cart"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">System Orders</p>
                    <p id="stat-orders" class="text-2xl font-bold text-gray-800">0</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-amber-100 text-amber-500 rounded-xl flex items-center justify-center font-bold text-xl">
                    <i data-lucide="phone"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">Helplines</p>
                    <p id="stat-helplines" class="text-2xl font-bold text-gray-800">0</p>
                </div>
            </div>
        </div>

        <!-- Live System Orders Table -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i data-lucide="list-ordered" class="text-orange-500"></i> System Live Orders
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 font-semibold text-gray-600 border-b">
                        <tr>
                            <th class="p-3">Order ID</th>
                            <th class="p-3">Customer</th>
                            <th class="p-3">Vendor</th>
                            <th class="p-3">Address</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody" class="divide-y divide-gray-100">
                        <tr><td colspan="6" class="p-6 text-center text-gray-400">Loading live orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Customer Helpline Management -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4 max-w-2xl">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i data-lucide="headphones" class="text-orange-500"></i> Customer Service Helplines
            </h2>
            <div class="flex gap-3">
                <input id="helpline-phone" type="text" placeholder="e.g. +8801700112233" class="px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-orange-500 flex-1">
                <button id="add-helpline-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition shadow-md shadow-orange-500/20">Add Helpline</button>
            </div>
            <div id="helpline-list" class="divide-y divide-gray-100 pt-2">
                <!-- Rendered dynamically -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 FoodHub Admin Dashboard. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://kdqyompkfmnocpihfzdj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkcXlvbXBrZm1ub2NwaWhmemRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDkxOTIsImV4cCI6MjEwNDg4NTE5Mn0.4gmwMruyf54ZdXAADEAa9noLZD5JMFyLOzrszUIMVns';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        lucide.createIcons();

        async function loadAdminData() {
            const { data: v } = await supabaseClient.from('vendors').select('*');
            if (v) document.getElementById('stat-vendors').innerText = v.length;

            const { data: r } = await supabaseClient.from('riders').select('*');
            if (r) document.getElementById('stat-riders').innerText = r.length;

            const { data: o } = await supabaseClient.from('orders').select('*');
            if (o) {
                document.getElementById('stat-orders').innerText = o.length;
                const tbody = document.getElementById('orders-tbody');
                tbody.innerHTML = '';
                if (o.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-gray-400">No orders found.</td></tr>';
                } else {
                    o.forEach(ord => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-50';
                        tr.innerHTML = `
                            <td class="p-3 font-bold text-gray-800">#${ord.id}</td>
                            <td class="p-3">${ord.customer_name || 'N/A'}</td>
                            <td class="p-3">${ord.vendor_name || 'N/A'}</td>
                            <td class="p-3 text-gray-500 text-xs">${ord.delivery_address || 'N/A'}</td>
                            <td class="p-3 font-bold text-orange-600">৳${ord.amount}</td>
                            <td class="p-3"><span class="bg-gray-100 font-semibold px-2.5 py-1 rounded-full text-xs text-gray-700">${ord.status}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            }

            const { data: h } = await supabaseClient.from('customer_service').select('*');
            if (h) {
                document.getElementById('stat-helplines').innerText = h.length;
                const list = document.getElementById('helpline-list');
                list.innerHTML = '';
                h.forEach(cs => {
                    const div = document.createElement('div');
                    div.className = 'py-3 flex justify-between items-center';
                    div.innerHTML = `
                        <span class="font-semibold text-gray-800 text-sm">${cs.phone}</span>
                        <button onclick="deleteHelpline(${cs.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                    `;
                    list.appendChild(div);
                });
            }
        }

        document.getElementById('add-helpline-btn').onclick = async () => {
            const phone = document.getElementById('helpline-phone').value;
            if (!phone) return;
            await supabaseClient.from('customer_service').insert([{ phone }]);
            document.getElementById('helpline-phone').value = '';
            loadAdminData();
        };

        async function deleteHelpline(id) {
            await supabaseClient.from('customer_service').delete().eq('id', id);
            loadAdminData();
        }

        loadAdminData();
    </script>
</body>
</html>
